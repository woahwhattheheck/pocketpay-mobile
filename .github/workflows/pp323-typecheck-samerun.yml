name: PP323 same-run typecheck comparison

on:
  push:
    branches:
      - validation/pp323-typecheck-samerun-ironfin-20261004

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies once
        run: |
          node --version
          npm --version
          npm ci

      - name: Compare exact base and candidate diagnostics
        env:
          BASE_SHA: c3a24abacb45030eb4fef41aabc46b312aaf54a3
          CANDIDATE_SHA: 20c8a7cd11f816dfe8315d7543536a5801a2c3da
        run: |
          set -euo pipefail

          for label in base candidate; do
            if [ "$label" = "base" ]; then
              ref="$BASE_SHA"
            else
              ref="$CANDIDATE_SHA"
            fi

            git checkout --detach "$ref"
            set +e
            npm run typecheck -- --pretty false > "$RUNNER_TEMP/$label.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$RUNNER_TEMP/$label.exit"
          done

          python - <<'PY'
          import collections
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          pattern = re.compile(r"^(.*)\((\d+),(\d+)\): error (TS\d+): (.*)$")

          def parse(label):
              text = (root / f"{label}.log").read_text(errors="replace")
              rows = []
              for line in text.splitlines():
                  match = pattern.match(line)
                  if match:
                      path, _line, _column, code, message = match.groups()
                      rows.append(f"{path}|{code}|{message}")
              return text, collections.Counter(rows)

          base_text, base_rows = parse("base")
          candidate_text, candidate_rows = parse("candidate")
          introduced = candidate_rows - base_rows
          resolved = base_rows - candidate_rows

          base_exit = int((root / "base.exit").read_text().strip())
          candidate_exit = int((root / "candidate.exit").read_text().strip())
          summary = [
              f"base_sha=c3a24abacb45030eb4fef41aabc46b312aaf54a3",
              f"candidate_sha=20c8a7cd11f816dfe8315d7543536a5801a2c3da",
              f"base_exit={base_exit}",
              f"candidate_exit={candidate_exit}",
              f"base_diagnostics={sum(base_rows.values())}",
              f"candidate_diagnostics={sum(candidate_rows.values())}",
              f"introduced_diagnostics={sum(introduced.values())}",
              f"resolved_diagnostics={sum(resolved.values())}",
          ]

          print("PP323_TYPECHECK_SUMMARY")
          print("\n".join(summary))
          print("PP323_INTRODUCED_BEGIN")
          for row, count in sorted(introduced.items()):
              for _ in range(count):
                  print(row)
          print("PP323_INTRODUCED_END")
          print("PP323_RESOLVED_BEGIN")
          for row, count in sorted(resolved.items()):
              for _ in range(count):
                  print(row)
          print("PP323_RESOLVED_END")

          if introduced:
              raise SystemExit(1)
          PY
